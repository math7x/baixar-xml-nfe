<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baixar XML de NFe</title><link rel="stylesheet" href="popup.css"></head>
<body><header><div class="mark">XML</div><div><h1>Baixar XML de NFe</h1><p>Selecione as notas que quer consultar</p></div></header>
<button id="capture" class="capture">Buscar notas e dados na página aberta</button>
<label for="list">Notas encontradas</label>
<div class="tools"><span id="count">0 chaves válidas</span><button id="selectAll" class="quiet">Selecionar todas</button></div><section id="list" aria-label="Chaves de acesso"></section>
<div id="notice" role="status"></div><button id="start" class="primary" disabled>Consultar selecionadas</button>
<p class="hint">A captura passa por cada chave para ler o tooltip. Confira razão social e valor; resolva o hCaptcha manualmente.</p><script src="popup.js"></script></body></html>
